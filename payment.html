<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Turinger '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000000;
            color: #d5ffe9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .payment-container {
            background: rgba(10, 14, 16, 0.08);
            backdrop-filter: blur(3px) saturate(110%);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            border-radius: 8px;
            border: 1px solid rgba(92, 179, 255, 0.2);
        }

        .payment-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .payment-header h1 {
            font-family: "Zen Dots", sans-serif;
            font-size: 2.5rem;
            color: #5CB3FF;
            margin-bottom: 10px;
        }

        .payment-header p {
            color: rgba(170, 220, 255, 0.6);
        }

        .payment-info {
            background: rgba(92, 179, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #5CB3FF;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: rgba(170, 220, 255, 0.7);
        }

        .info-value {
            color: #5CB3FF;
            font-weight: 600;
        }

        .message {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(0, 200, 100, 0.25);
            border: 2px solid #00c864;
            color: #5fff9a;
        }

        .message.error {
            background: rgba(255, 100, 100, 0.25);
            border: 2px solid #ff6464;
            color: #ff9999;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid rgba(92, 179, 255, 0.4);
            background: transparent;
            color: #5CB3FF;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .btn:hover {
            border-color: #5CB3FF;
            color: #7ec8ff;
            box-shadow: 0 0 20px rgba(92, 179, 255, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .payment-container {
                padding: 40px 20px;
            }

            .payment-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="payment-header">
            <h1>Payment</h1>
            <p>Confirm your registration</p>
        </div>

        <div id="message" class="message"></div>

        <div class="payment-info">
            <div class="info-row">
                <span class="info-label">Name:</span>
                <span class="info-value" id="nameDisplay">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Email:</span>
                <span class="info-value" id="emailDisplay">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Phone:</span>
                <span class="info-value" id="phoneDisplay">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Type:</span>
                <span class="info-value" id="typeDisplay">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Events:</span>
                <span class="info-value" id="eventsDisplay">-</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn" onclick="confirmPayment()">Confirm Payment</button>
            <button class="btn" onclick="goBack()">Go Back</button>
        </div>
    </div>

    <!-- Firebase Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9S6-j_5sNty-yLyYFRHyqscz1_dgOQLI",
            authDomain: "turinger26.firebaseapp.com",
            projectId: "turinger26",
            storageBucket: "turinger26.firebasestorage.app",
            messagingSenderId: "181306308808",
            appId: "1:181306308808:web:73b641e852126a29674dfd",
            measurementId: "G-31W30HE9HW"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            window.firebaseReady = true;
            window.db = db;
            window.addDoc = addDoc;
            window.collection = collection;
            
        } catch (error) {
            console.error("✗ Firebase init failed:", error);
            window.firebaseReady = false;
        }
    </script>

    <!-- Main Script -->
    <script>
        let registrationData = null;
        let registrationType = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Get data from sessionStorage
            const data = sessionStorage.getItem('registrationData');
            const type = sessionStorage.getItem('registrationType');

            if (!data || !type) {
                showMessage('No registration data found. Redirecting...', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }

            registrationData = JSON.parse(data);
            registrationType = type;

            // Display data
            document.getElementById('nameDisplay').textContent = registrationData.fullName || '-';
            document.getElementById('emailDisplay').textContent = registrationData.email || '-';
            document.getElementById('phoneDisplay').textContent = registrationData.phone || '-';
            document.getElementById('typeDisplay').textContent = registrationType.charAt(0).toUpperCase() + registrationType.slice(1);
            document.getElementById('eventsDisplay').textContent = 
                (registrationData.events && registrationData.events.length > 0) 
                    ? registrationData.events.join(', ') 
                    : 'None';
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message show ${type}`;
        }

        async function confirmPayment() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Processing...';
            btn.classList.add('disabled');

            try {
                if (!window.firebaseReady || !window.db || !window.addDoc) {
                    throw new Error('Firebase not ready');
                }

                // Determine collection based on registration type
                const collectionName = registrationType === 'hackathon' 
                    ? 'hackathon_registrations' 
                    : registrationType === 'symposium'
                    ? 'symposium_registrations'
                    : 'registrations';

                // Save to appropriate collection
                const docRef = await window.addDoc(window.collection(window.db, collectionName), {
                    fullName: registrationData.fullName,
                    email: registrationData.email,
                    phone: registrationData.phone,
                    college: registrationData.college,
                    events: registrationData.events || [],
                    type: registrationType,
                    paymentStatus: 'confirmed',
                    timestamp: new Date().toISOString()
                });

                showMessage('✓ Payment confirmed! Registration complete!', 'success');

                // Clear sessionStorage
                sessionStorage.removeItem('registrationData');
                sessionStorage.removeItem('registrationType');

                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                showMessage(`Error: ${error.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Confirm Payment';
                btn.classList.remove('disabled');
            }
        }

        function goBack() {
            // Redirect back based on type
            if (registrationType === 'hackathon') {
                window.location.href = 'hackathon.html';
            } else if (registrationType === 'symposium') {
                window.location.href = 'symposium.html';
            } else {
                window.location.href = 'registration.html';
            }
        }
    </script>
</body>
</html>
