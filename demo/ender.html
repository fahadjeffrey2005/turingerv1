<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <title>Ender - Turinger '26</title>
    <link rel="stylesheet" href="../style.css?v=54">
    <link rel="stylesheet" href="../dots/dots.css?v=54">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000000;
            color: #d5ffe9;
            min-height: 400vh;
        }

        /* Canvas background for dots */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            text-align: center;
        }

        h1 {
            font-family: "BBH Bartle", sans-serif;
            font-size: 3.5rem;
            color: #0080FE;
            margin-bottom: 20px;
            letter-spacing: 0.15em;
        }

        p {
            font-size: 1.1rem;
            color: rgba(213, 255, 233, 0.8);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Logo overlay for end sequence */
        #logoOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
        }

        #logoOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #logoOverlay img {
            max-width: 680px;
            max-height: 680px;
            width: 100%;
            height: auto;
            animation: logoPulse 0.8s ease-out;
        }

        @keyframes logoPulse {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="theme-black">
    <!-- Canvas for dots background -->
    <canvas id="fluidCanvas"></canvas>

    <div class="container">
        <div class="content">
        </div>
    </div>

    <!-- Logo overlay for end sequence -->
    <div id="logoOverlay">
        <img src="../logos/turingerlogo.png" alt="Turinger Logo">
    </div>

    <!-- THREE.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Dots System -->
    <script src="../dots/dots.js"></script>
    
    <!-- Scroll Animation Module -->
    <script src="scrollAnimation.js"></script>
    
    <script>
        // Initialize scroll animation with default config
        window.initScrollAnimation();
    </script>
</body>
</html>
