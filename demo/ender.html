<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <title>Ender - Turinger '26</title>
    <link rel="stylesheet" href="../style.css?v=54">
    <link rel="stylesheet" href="../dots/dots.css?v=54">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000000;
            color: #d5ffe9;
            min-height: 400vh;
        }

        /* Canvas background for dots */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            text-align: center;
        }

        h1 {
            font-family: "BBH Bartle", sans-serif;
            font-size: 3.5rem;
            color: #0080FE;
            margin-bottom: 20px;
            letter-spacing: 0.15em;
        }

        p {
            font-size: 1.1rem;
            color: rgba(213, 255, 233, 0.8);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
    </style>
</head>
<body class="theme-black">
    <!-- Canvas for dots background -->
    <canvas id="fluidCanvas"></canvas>

    <div class="container">
        <div class="content">
            <h1>ENDER SEQUENCE</h1>
            <p>Extended scrollable area with black background and interactive dots particle system.</p>
        </div>
    </div>

    <!-- THREE.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Dots System -->
    <script src="../dots/dots.js"></script>
    
    <script>
        // Initialize dots on page load
        window.addEventListener('load', () => {
            if (typeof window.initDots === 'function') {
                window.initDots();
            }
            if (typeof window.setDotsTheme === 'function') {
                window.setDotsTheme('black');
            }

            // Scroll-based animation for dots fade and globe growth
            let scene, camera, particleSystem;
            
            // Give time for dots to initialize
            setTimeout(() => {
                // Try to access the THREE.js scene from the dots system
                const canvas = document.getElementById('fluidCanvas');
                
                window.addEventListener('scroll', () => {
                    // Calculate scroll progress (0 to 1)
                    const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
                    const scrollProgress = window.scrollY / scrollHeight;
                    
                    // Fade out particles: opacity decreases from 1 to 0
                    const particleOpacity = Math.max(0, 1 - scrollProgress * 1.5);
                    
                    // Exponential globe growth: scale increases exponentially
                    // Start at 1x, grows to massive size
                    const globeScale = Math.pow(1 + (scrollProgress * 3), 2.5);
                    
                    // Fade ONLY the particles material, NOT the globe
                    if (window.dotsParticleMaterial) {
                        window.dotsParticleMaterial.opacity = particleOpacity;
                        window.dotsParticleMaterial.needsUpdate = true;
                    }
                    
                    // Keep globe and everything else at full opacity
                    if (window.dotsScene && window.dotsScene.children) {
                        window.dotsScene.children.forEach(child => {
                            if (child.material && child !== window.dotsParticles) {
                                child.material.opacity = 1.0;
                                if (child.material.needsUpdate !== undefined) {
                                    child.material.needsUpdate = true;
                                }
                            }
                        });
                    }
                    
                    // Scale camera zoom for exponential growth effect
                    if (window.dotsCamera) {
                        window.dotsCamera.position.z = 600 / globeScale;
                    }
                }, { passive: true });
            }, 500);
        });
    </script>
</body>
</html>
