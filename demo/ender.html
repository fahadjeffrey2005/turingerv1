<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <title>Ender - Turinger '26</title>
    <link rel="stylesheet" href="../style.css?v=54">
    <link rel="stylesheet" href="../dots/dots.css?v=54">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000000;
            color: #d5ffe9;
            min-height: 400vh;
        }

        /* Canvas background for dots */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            text-align: center;
        }

        h1 {
            font-family: "BBH Bartle", sans-serif;
            font-size: 3.5rem;
            color: #0080FE;
            margin-bottom: 20px;
            letter-spacing: 0.15em;
        }

        p {
            font-size: 1.1rem;
            color: rgba(213, 255, 233, 0.8);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
    </style>
</head>
<body class="theme-black">
    <!-- Canvas for dots background -->
    <canvas id="fluidCanvas"></canvas>

    <div class="container">
        <div class="content">
        </div>
    </div>

    <!-- THREE.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Dots System -->
    <script src="../dots/dots.js"></script>
    
    <script>
        // Initialize scroll animation module
        window.initScrollAnimation = function(config = {}) {
            const {
                particleFadeRate = 1.5,
                cameraZStart = 400,
                cameraZEnd = 50,
                theme = 'black',
                initDelay = 500
            } = config;

            window.addEventListener('load', () => {
                if (typeof window.initDots === 'function') {
                    window.initDots();
                }
                if (typeof window.setDotsTheme === 'function') {
                    window.setDotsTheme(theme);
                }

                // Give time for dots to initialize
                setTimeout(() => {
                    window.addEventListener('scroll', () => {
                        // Calculate scroll progress (0 to 1)
                        const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
                        const scrollProgress = window.scrollY / scrollHeight;
                        
                        // Fade out particles: opacity decreases from 1 to 0
                        const particleOpacity = Math.max(0, 1 - scrollProgress * particleFadeRate);
                        
                        // Fade ONLY the particles material, NOT the globe
                        if (window.dotsParticleMaterial) {
                            window.dotsParticleMaterial.opacity = particleOpacity;
                            window.dotsParticleMaterial.needsUpdate = true;
                        }
                        
                        // Move camera closer to make globe appear larger
                        const cameraZRange = cameraZStart - cameraZEnd;
                        const newZ = cameraZStart - (scrollProgress * cameraZRange);
                        if (typeof window.setDynamicCameraZ === 'function') {
                            window.setDynamicCameraZ(newZ);
                        }
                    }, { passive: true });
                }, initDelay);
            });
        };

        // Initialize with default config
        window.initScrollAnimation();
    </script>
</body>
</html>
