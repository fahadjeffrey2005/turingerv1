<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <title>Sponsorship - Turinger '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0018F9;
            --primary-light: #0080FE;
            --accent-gold: #D4AF37;
            --accent-silver: #C0C0C0;
            --accent-bronze: #CD7F32;
            --accent-platinum: #E5E4E2;
            --text-dark: #0b1814;
            --text-light: #d5ffe9;
            --text-light-secondary: #a8e6d8;
            --bg-white: #ffffff;
            --bg-black: #000000;
            --background-blur: 0px;
            --background-dim: 0;
        }

        html {
            height: 100%;
            scroll-behavior: smooth;
            scrollbar-gutter: stable;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-black);
            color: var(--text-light);
            min-height: 100%;
            overflow-x: hidden;
            transition: background 0.9s ease, color 0.9s ease;
        }

        body.theme-white {
            background: var(--bg-white);
            color: var(--text-dark);
        }

        /* Background layers */
        #whiteBackground {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-black);
            z-index: -2;
            transition: background 0.9s ease;
        }

        body.theme-white #whiteBackground {
            background: var(--bg-white);
        }

        /* 3D Canvas */
        #fluidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glass blur overlay */
        #sponsorshipBlurOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, var(--background-dim));
            backdrop-filter: blur(var(--background-blur));
            -webkit-backdrop-filter: blur(var(--background-blur));
            pointer-events: none;
            z-index: 5;
        }

        /* Back button */
        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: var(--primary-light);
            background: rgba(0, 20, 60, 0.3);
            border: 1px solid rgba(0, 128, 254, 0.4);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            z-index: 200;
            cursor: pointer;
        }

        body.theme-white .back-link {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 128, 254, 0.3);
            color: var(--primary-light);
        }

        .back-link:hover {
            transform: translateY(-3px);
            background: rgba(0, 40, 100, 0.15);
            box-shadow: 0 8px 24px rgba(0, 128, 254, 0.2);
        }

        /* Main container */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 130px 60px 100px;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Header section */
        .sponsorship-header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 1000px;
        }

        .bbh-bartle-regular {
            font-family: "BBH Bartle", sans-serif;
            font-weight: 400;
        }

        .header-title {
            font-size: clamp(42px, 6vw, 62px);
            font-family: "BBH Bartle", sans-serif;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--primary-light), #00B4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.01em;
            line-height: 1.1;
            font-style: normal;
        }

        body.theme-white .header-title {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: clamp(15px, 2vw, 20px);
            color: rgba(213, 255, 233, 0.8);
            margin-bottom: 40px;
            line-height: 1.7;
            letter-spacing: 0.3px;
            font-weight: 400;
            font-style: italic;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        body.theme-white .header-subtitle {
            color: rgba(11, 24, 20, 0.75);
            font-weight: 400;
        }

        /* Tiers grid */
        .sponsorship-tiers {
            display: none;
        }

        /* PDF Viewer Styles */
        .pdf-viewer-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            gap: 16px;
            margin: 0 auto 60px;
        }

        .pdf-viewer {
            position: relative;
            width: 100%;
            height: 950px;
            background: rgba(0, 20, 60, 0.2);
            border: 1px solid rgba(0, 128, 254, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 16px;
            background: transparent;
            border: none;
            border-radius: 0;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            flex-wrap: wrap;
        }

        .page-navigation {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(0, 128, 254, 0.3);
            background: transparent;
            color: rgba(0, 212, 255, 0.7);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            font-weight: bold;
        }

        .nav-button:hover:not(:disabled) {
            background: transparent;
            border-color: rgba(0, 128, 254, 0.5);
            color: rgba(0, 212, 255, 0.9);
            transform: none;
            box-shadow: none;
        }

        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(220, 255, 244, 0.7);
            font-size: 13px;
            font-weight: 400;
        }

        .page-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-input {
            width: 50px;
            padding: 6px 10px;
            border: 1px solid rgba(0, 128, 254, 0.2);
            background: transparent;
            color: rgba(0, 212, 255, 0.8);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        .page-input:focus {
            outline: none;
            border-color: rgba(0, 128, 254, 0.4);
            background: transparent;
            box-shadow: none;
        }

        .download-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            color: rgba(0, 212, 255, 0.7);
            border: 1px solid rgba(0, 128, 254, 0.3);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
        }

        .download-button:hover {
            transform: none;
            border-color: rgba(0, 128, 254, 0.5);
            color: rgba(0, 212, 255, 0.9);
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .pdf-viewer {
                height: 500px;
            }

            .pdf-controls {
                flex-direction: row;
                gap: 12px;
                padding: 12px;
            }

            .page-navigation {
                width: auto;
                justify-content: center;
            }

            .page-info {
                font-size: 12px;
            }

            .download-button {
                width: auto;
                justify-content: center;
                padding: 8px 14px;
                font-size: 11px;
            }

            .sponsorship-footer {
                flex-direction: column;
                gap: 30px;
                align-items: flex-start;
            }

            .sponsorship-contact-card {
                width: 100%;
            }
        }

        /* Tier card */
        .tier-card {
            position: relative;
            padding: 48px 40px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 2px solid;
            background: rgba(0, 20, 60, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        body.theme-white .tier-card {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 128, 254, 0.08);
        }

        /* Platinum tier (featured) */
        .tier-card.platinum {
            grid-column: 1;
            border-color: var(--accent-platinum);
            box-shadow: 0 0 60px rgba(0, 128, 254, 0.3), inset 0 0 40px rgba(0, 128, 254, 0.08);
            background: rgba(0, 20, 80, 0.4);
            padding: 36px 28px;
        }

        .tier-card.platinum:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 30px 80px rgba(0, 128, 254, 0.5), inset 0 0 40px rgba(0, 128, 254, 0.12);
        }

        body.theme-white .tier-card.platinum {
            box-shadow: 0 0 40px rgba(0, 128, 254, 0.25);
        }

        body.theme-white .tier-card.platinum:hover {
            box-shadow: 0 20px 60px rgba(0, 128, 254, 0.4);
        }

        /* Gold tier */
        .tier-card.gold {
            border-color: var(--accent-gold);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
            background: rgba(50, 35, 0, 0.2);
        }

        .tier-card.gold:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.4);
        }

        body.theme-white .tier-card.gold {
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Silver tier */
        .tier-card.silver {
            border-color: var(--accent-silver);
            box-shadow: 0 0 40px rgba(192, 192, 192, 0.15);
            background: rgba(50, 50, 60, 0.15);
        }

        .tier-card.silver:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 60px rgba(192, 192, 192, 0.3);
        }

        body.theme-white .tier-card.silver {
            box-shadow: 0 0 30px rgba(192, 192, 192, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Bronze tier */
        .tier-card.bronze {
            border-color: var(--accent-bronze);
            box-shadow: 0 0 40px rgba(205, 127, 50, 0.15);
            background: rgba(60, 35, 10, 0.15);
        }

        .tier-card.bronze:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 60px rgba(205, 127, 50, 0.3);
        }

        body.theme-white .tier-card.bronze {
            box-shadow: 0 0 30px rgba(205, 127, 50, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Tier badge */
        .tier-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 999px;
            width: fit-content;
            margin-bottom: 18px;
            font-family: "BBH Bartle", sans-serif;
            font-style: normal;
        }

        .tier-badge.platinum {
            background: rgba(0, 128, 254, 0.2);
            color: #00D4FF;
            border: 1px solid rgba(0, 128, 254, 0.5);
        }

        .tier-badge.gold {
            background: rgba(212, 175, 55, 0.2);
            color: #FFD700;
            border: 1px solid rgba(212, 175, 55, 0.6);
        }

        .tier-badge.silver {
            background: rgba(192, 192, 192, 0.2);
            color: #E8E8E8;
            border: 1px solid rgba(192, 192, 192, 0.5);
        }

        .tier-badge.bronze {
            background: rgba(205, 127, 50, 0.2);
            color: #FFB347;
            border: 1px solid rgba(205, 127, 50, 0.5);
        }

        /* Tier name */
        .tier-name {
            font-size: clamp(20px, 2.2vw, 26px);
            font-family: "BBH Bartle", sans-serif;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.02em;
            line-height: 1.2;
            font-style: normal;
        }

        .tier-price {
            font-size: clamp(16px, 2vw, 22px);
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #00D4FF, #00F0FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0em;
        }

        .tier-duration {
            font-size: 11px;
            color: rgba(213, 255, 233, 0.65);
            margin-bottom: 22px;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        body.theme-white .tier-duration {
            color: rgba(11, 24, 20, 0.7);
        }

        /* Benefits list */
        .tier-benefits {
            flex: 1;
            margin-bottom: 24px;
        }

        .benefit-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(213, 255, 233, 0.9);
            font-weight: 300;
            letter-spacing: 0.1px;
        }

        body.theme-white .benefit-item {
            color: rgba(11, 24, 20, 0.9);
        }

        .benefit-check {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            margin-top: 2px;
            font-weight: 700;
        }

        .tier-card.platinum .benefit-check {
            background: rgba(0, 212, 255, 0.3);
            color: #00F0FF;
        }

        .tier-card.gold .benefit-check {
            background: rgba(212, 175, 55, 0.3);
            color: #FFD700;
        }

        .tier-card.silver .benefit-check {
            background: rgba(192, 192, 192, 0.3);
            color: #E8E8E8;
        }

        .tier-card.bronze .benefit-check {
            background: rgba(205, 127, 50, 0.3);
            color: #FFB347;
        }

        /* CTA Button */
        .tier-cta {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: "BBH Bartle", sans-serif;
            font-style: normal;
        }

        .tier-card.platinum .tier-cta {
            background: linear-gradient(135deg, #00D4FF, #0080FE);
            color: #000000;
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.35);
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .tier-card.platinum .tier-cta:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 56px rgba(0, 212, 255, 0.55);
        }

        .tier-card.gold .tier-cta {
            background: rgba(255, 215, 0, 0.15);
            color: #FFD700;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        .tier-card.gold .tier-cta:hover {
            background: rgba(255, 215, 0, 0.25);
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3);
        }

        .tier-card.silver .tier-cta {
            background: rgba(232, 232, 232, 0.12);
            color: #E8E8E8;
            border: 2px solid rgba(232, 232, 232, 0.4);
        }

        .tier-card.silver .tier-cta:hover {
            background: rgba(232, 232, 232, 0.2);
            box-shadow: 0 8px 32px rgba(232, 232, 232, 0.2);
        }

        .tier-card.bronze .tier-cta {
            background: rgba(255, 179, 71, 0.12);
            color: #FFB347;
            border: 2px solid rgba(255, 179, 71, 0.4);
        }

        .tier-card.bronze .tier-cta:hover {
            background: rgba(255, 179, 71, 0.2);
            box-shadow: 0 8px 32px rgba(255, 179, 71, 0.2);
        }

        /* Footer section */
        .sponsorship-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            max-width: 1100px;
            border-top: none;
            padding-top: 0;
            padding-bottom: 60px;
            margin-top: 80px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        .sponsorship-footer-text {
            flex: 0 0 auto;
            text-align: left;
        }

        .sponsorship-footer-text h2 {
            font-size: 1rem;
            margin: 0 0 12px 0;
            color: rgba(220, 255, 244, 0.8);
            font-family: 'BBH Bartle', sans-serif;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .sponsorship-contact-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            padding: 24px;
            border-radius: 12px;
            background: rgba(0, 128, 254, 0.05);
            border: 1.5px solid rgba(0, 128, 254, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sponsorship-contact-image {
            display: none;
        }

        .sponsorship-contact-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            width: 100%;
        }

        .sponsorship-contact-name {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #ffffff;
            font-family: "BBH Bartle", sans-serif;
            margin: 0;
        }

        .sponsorship-contact-role {
            font-size: 0.85rem;
            color: rgba(0, 128, 254, 0.8);
            margin: 0;
            font-weight: 500;
        }

        .sponsorship-contact-org {
            font-size: 0.8rem;
            color: rgba(0, 128, 254, 0.6);
            margin: 0 0 8px 0;
        }

        .sponsorship-contact-info {
            font-size: 0.85rem;
            margin: 4px 0;
            color: rgba(213, 255, 233, 0.8);
        }

        .sponsorship-contact-info span:first-child {
            font-weight: 600;
            color: rgba(0, 128, 254, 0.7);
        }

        .footer-text {
            font-size: 17px;
            color: rgba(213, 255, 233, 0.85);
            line-height: 2;
            margin-bottom: 40px;
            letter-spacing: 0.3px;
            font-weight: 300;
        }

        body.theme-white .footer-text {
            color: rgba(11, 24, 20, 0.8);
            border-top-color: rgba(0, 128, 254, 0.15);
            font-weight: 400;
        }

        .contact-email {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #00D4FF;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 12px 24px;
            border-radius: 14px;
            background: rgba(0, 212, 255, 0.12);
            border: 1.5px solid rgba(0, 212, 255, 0.35);
            letter-spacing: 0.4px;
        }

        body.theme-white .contact-email {
            color: var(--primary-light);
            background: rgba(0, 128, 254, 0.1);
            border-color: rgba(0, 128, 254, 0.25);
        }

        .contact-email:hover {
            gap: 16px;
            color: #00F0FF;
            background: rgba(0, 212, 255, 0.18);
            box-shadow: 0 10px 32px rgba(0, 212, 255, 0.3);
            transform: translateY(-3px);
        }

        body.theme-white .contact-email:hover {
            color: #0080FE;
            box-shadow: 0 10px 32px rgba(0, 128, 254, 0.25);
        }

        /* Responsive design */
        @media (max-width: 1400px) {
            .sponsorship-tiers {
                gap: 20px;
            }

            .tier-card {
                padding: 32px 24px;
            }
        }

        @media (max-width: 1024px) {
            main {
                padding: 100px 32px 60px;
            }

            .sponsorship-header {
                margin-bottom: 70px;
            }

            .sponsorship-tiers {
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }

            .tier-card.platinum {
                grid-column: 1;
            }
        }

        @media (max-width: 768px) {
            main {
                padding: 90px 24px 50px;
            }

            .header-title {
                font-size: 40px;
            }

            .sponsorship-header {
                margin-bottom: 60px;
            }

            .sponsorship-tiers {
                grid-template-columns: repeat(2, 1fr);
                gap: 24px;
            }

            .tier-card {
                padding: 30px 22px;
            }

            .tier-name {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            main {
                padding: 80px 18px 40px;
            }

            .header-title {
                font-size: 32px;
                margin-bottom: 16px;
            }

            .header-subtitle {
                font-size: 15px;
                margin-bottom: 30px;
            }

            .sponsorship-header {
                margin-bottom: 50px;
            }

            .sponsorship-tiers {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .tier-card {
                padding: 28px 20px;
            }

            .tier-name {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .tier-price {
                font-size: 16px;
            }

            .tier-badge {
                font-size: 8px;
                padding: 6px 12px;

<body>
    <!-- Background layer -->
    <div id="whiteBackground"></div>
    
    <!-- 3D Canvas Background (Dots System) -->
    <canvas id="fluidCanvas"></canvas>

    <!-- Blur overlay -->
    <div id="sponsorshipBlurOverlay"></div>

    <!-- Back button -->
    <a href="index.html" class="back-link" onclick="history.back(); return false;">
        ← Back
    </a>

    <main>
        <!-- Header -->
        <section class="sponsorship-header">
            <h1 class="header-title">Sponsorship & Partnerships</h1>
        </section>

        <!-- Sponsorship Tiers -->
        <div class="sponsorship-tiers"></div>

        <!-- PDF Viewer -->
        <div class="pdf-viewer-container">
            <div class="pdf-viewer">
                <iframe 
                    id="pdfFrame" 
                    class="pdf-frame"
                    src="files/ACM%20New%20Sponsorship%20(1).pdf#page=1"
                    type="application/pdf"
                    allow="fullscreen">
                </iframe>
            </div>

            <div class="pdf-controls">
                <div class="page-navigation">
                    <button id="prevPage" class="nav-button" title="Previous page">‹</button>
                    
                    <div class="page-info">
                        <span>Page</span>
                        <div class="page-input-group">
                            <input 
                                type="number" 
                                id="pageInput" 
                                class="page-input" 
                                value="1" 
                                min="1"
                                max="1"
                            >
                            <span>of <span id="totalPages">1</span></span>
                        </div>
                    </div>

                    <button id="nextPage" class="nav-button" title="Next page">›</button>
                </div>

                <a id="downloadBtn" class="download-button" download>
                    ⬇ Download PDF
                </a>
            </div>
        </div>

        <!-- Footer -->
        <section class="sponsorship-footer">
            <div class="sponsorship-footer-text">
                <h2>For More Details, Contact</h2>
            </div>

            <div class="sponsorship-contact-card">
                <div class="sponsorship-contact-content">
                    <h3 class="sponsorship-contact-name">S P Bharath</h3>
                    <p class="sponsorship-contact-role">Sponsorship Coordinator</p>
                    <p class="sponsorship-contact-org">MITB ACM Student Chapter</p>
                    <p class="sponsorship-contact-info">
                        <span>Phone:</span> +91 78931 84692
                    </p>
                    <p class="sponsorship-contact-info">
                        <span>Email:</span> sakarey.mitblr2023@learner.manipal.edu
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- THREE.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Infinity Background System -->
    <script src="src/js/infinity-background.js"></script>
    
    <!-- Registration Component -->
    <link rel="stylesheet" href="components/registration.css">
    <script src="components/sponsorship-enquiry.js"></script>
    
    <!-- PDF Viewer Script -->
    <script>
        let currentPage = 1;
        let totalPages = 1;
        const pdfUrl = 'files/ACM%20New%20Sponsorship%20(1).pdf';

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize infinity background
            const background = new InfinityBackground({
                canvasId: 'fluidCanvas',
                gridSize: 50,
                spacing: 5,
                backgroundColor: 0x000000,
                lineColor: 0x0080FE,
                lineOpacity: 0.4,
                particleColor: { r: 1.0, g: 1.0, b: 1.0 },
                particleSize: 0.5,
                hoverColor: { r: 0, g: 0.502, b: 1 },
                hoverDistance: 30,
                hoverLift: 15,
                cameraPosZ: 60,
                cameraPosY: 15
            });
            background.init();

            // PDF Viewer Controls
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            const pageInput = document.getElementById('pageInput');
            const downloadBtn = document.getElementById('downloadBtn');
            const pdfFrame = document.getElementById('pdfFrame');

            // Set download link
            downloadBtn.href = pdfUrl;
            downloadBtn.download = 'ACM_Sponsorship_Packages.pdf';

            // Try to detect total pages using PDF.js if available
            detectTotalPages();

            // Navigation buttons
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    updatePDF();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    updatePDF();
                }
            });

            // Page input
            pageInput.addEventListener('change', (e) => {
                let page = parseInt(e.target.value);
                if (isNaN(page) || page < 1) page = 1;
                if (page > totalPages) page = totalPages;
                currentPage = page;
                updatePDF();
            });

            // Update buttons
            updateButtons();
        });

        function updatePDF() {
            const pdfFrame = document.getElementById('pdfFrame');
            const pageInput = document.getElementById('pageInput');
            
            pdfFrame.src = `${pdfUrl}#page=${currentPage}`;
            pageInput.value = currentPage;
            
            updateButtons();
        }

        function updateButtons() {
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        function detectTotalPages() {
            // For PDF embedded in iframe, we estimate pages based on typical PDF size
            // This is a fallback - browsers don't reliably expose page count
            // We'll use a reasonable estimate based on the document
            
            // Load PDF.js if available for accurate page detection
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
            script.onload = () => {
                if (typeof pdfjsLib !== 'undefined') {
                    pdfjsLib.getDocument(pdfUrl).promise.then((pdf) => {
                        totalPages = pdf.numPages;
                        document.getElementById('totalPages').textContent = totalPages;
                        document.getElementById('pageInput').max = totalPages;
                        updateButtons();
                    });
                } else {
                    // Fallback: estimate pages
                    totalPages = 4; // Common sponsorship PDF page count
                    document.getElementById('totalPages').textContent = totalPages;
                    document.getElementById('pageInput').max = totalPages;
                }
            };
            document.head.appendChild(script);
        }
    </script>
</body>
