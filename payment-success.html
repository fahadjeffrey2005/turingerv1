<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Turinger '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000000;
            color: #d5ffe9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .success-container {
            background: rgba(10, 14, 16, 0.08);
            backdrop-filter: blur(3px) saturate(110%);
            border: 1px solid rgba(213, 255, 233, 0.2);
            border-radius: 12px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: rgba(0, 255, 150, 0.1);
            border: 2px solid #00ff96;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-family: "Zen Dots", cursive;
            font-size: 32px;
            margin-bottom: 15px;
            color: #00ff96;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 16px;
            color: #a0d8c7;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .details {
            background: rgba(0, 255, 150, 0.05);
            border-left: 3px solid #00ff96;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
            border-radius: 4px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 150, 0.1);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #00ff96;
        }

        .detail-value {
            color: #a0d8c7;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #00ff96;
            color: #000;
        }

        .btn-primary:hover {
            background: #00cc78;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 150, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #d5ffe9;
            border: 1px solid rgba(213, 255, 233, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(213, 255, 233, 0.4);
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .message.error {
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: #ff6464;
        }

        .loader {
            border: 3px solid rgba(0, 255, 150, 0.2);
            border-top: 3px solid #00ff96;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="success-container" id="successContainer" style="display: none;">
        <div class="success-icon">✓</div>
        <h1>Payment Successful</h1>
        <p>Your registration has been confirmed! See you at Turinger '26</p>
        
        <div class="details" id="detailsSection">
            <div class="detail-row">
                <span class="detail-label">Name:</span>
                <span class="detail-value" id="detailName">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value" id="detailEmail">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Team:</span>
                <span class="detail-value" id="detailTeam">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment ID:</span>
                <span class="detail-value" id="detailPaymentId">-</span>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="goHome()">Return to Home</button>
            <button class="btn btn-secondary" onclick="downloadReceipt()">Download Receipt</button>
        </div>
    </div>

    <div class="success-container" id="processingContainer">
        <div class="loader"></div>
        <h1>Processing Payment</h1>
        <p>Please wait while we confirm your payment...</p>
        <div id="message"></div>
    </div>

    <!-- Firebase Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfGRvG8aeD9YYEsy9n7y1RmA7xKIxK1NE",
            authDomain: "turinger-db734.firebaseapp.com",
            projectId: "turinger-db734",
            storageBucket: "turinger-db734.firebasestorage.app",
            messagingSenderId: "449654016876",
            appId: "1:449654016876:web:5b516018957d9489c94149",
            measurementId: "G-ZH8CLKF024"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            window.firebaseReady = true;
            window.db = db;
            window.addDoc = addDoc;
            window.collection = collection;
            
        } catch (error) {
            console.error("✗ Firebase init failed:", error);
            window.firebaseReady = false;
        }
    </script>

    <script>
        let registrationData = null;
        let paymentId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Get payment ID from URL parameters (sent by payment portal)
            const urlParams = new URLSearchParams(window.location.search);
            paymentId = urlParams.get('paymentId') || 'PAY-' + Date.now();
            const paymentStatus = urlParams.get('status') || 'success';

            // Get registration data from sessionStorage
            const data = sessionStorage.getItem('registrationData');
            const type = sessionStorage.getItem('registrationType');

            if (!data || !type) {
                showError('No registration data found.');
                return;
            }

            registrationData = JSON.parse(data);

            // Check payment status
            if (paymentStatus !== 'success') {
                showError('Payment was not successful. Please try again.');
                return;
            }

            // Store in database
            await storeInDatabase();
        });

        async function storeInDatabase() {
            try {
                if (!window.firebaseReady || !window.db || !window.addDoc) {
                    throw new Error('Firebase not ready');
                }

                // Prepare data with payment confirmation
                const docData = {
                    ...registrationData,
                    paymentStatus: 'confirmed',
                    paymentId: paymentId,
                    paymentDate: new Date().toISOString(),
                    timestamp: new Date().toISOString(),
                    event: 'hackathon'
                };

                // Save to hackathon_registrations collection
                const docRef = await window.addDoc(window.collection(window.db, 'hackathon_registrations'), docData);

                // Show success
                showSuccess();

                // Clear sessionStorage
                sessionStorage.removeItem('registrationData');
                sessionStorage.removeItem('registrationType');
                sessionStorage.removeItem('isNonMIT');

            } catch (error) {
                console.error('Database error:', error);
                showError(`Error saving registration: ${error.message}`);
            }
        }

        function showSuccess() {
            document.getElementById('processingContainer').style.display = 'none';
            document.getElementById('successContainer').style.display = 'block';

            // Display details
            if (registrationData.leaderName) {
                document.getElementById('detailName').textContent = registrationData.leaderName;
            }
            if (registrationData.leaderEmail) {
                document.getElementById('detailEmail').textContent = registrationData.leaderEmail;
            }
            if (registrationData.teamName) {
                document.getElementById('detailTeam').textContent = registrationData.teamName;
            }
            document.getElementById('detailPaymentId').textContent = paymentId;
        }

        function showError(message) {
            document.getElementById('processingContainer').style.display = 'block';
            const messageDiv = document.querySelector('#processingContainer #message');
            messageDiv.innerHTML = `<div class="message error">${message}</div>`;
            document.querySelector('#processingContainer .loader').style.display = 'none';
            document.querySelector('#processingContainer h1').textContent = 'Payment Verification';
            document.querySelector('#processingContainer p').textContent = message;
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function downloadReceipt() {
            alert('Receipt download feature coming soon!');
            // Implement receipt generation here
        }
    </script>
</body>
</html>
