<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Turinger '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000000;
            color: #d5ffe9;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        #fluidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: block;
        }

        .registration-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .back-to-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 12px 24px;
            background: rgba(92, 179, 255, 0.15);
            border: 1px solid rgba(92, 179, 255, 0.4);
            border-radius: 6px;
            color: #5CB3FF;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-to-home-btn:hover {
            background: rgba(92, 179, 255, 0.25);
            border-color: rgba(92, 179, 255, 0.6);
            box-shadow: 0 4px 16px rgba(92, 179, 255, 0.2);
        }

        .registration-modal-content {
            background: rgba(10, 14, 16, 0.08);
            backdrop-filter: blur(3px) saturate(110%);
            width: 100%;
            max-width: 1200px;
            padding: 60px 40px;
            border-radius: 0;
            border: none;
            box-shadow: none;
            margin: auto;
        }

        .registration-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .registration-header h1 {
            font-family: "Zen Dots", sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #5CB3FF;
            margin-bottom: 10px;
            letter-spacing: 0.06em;
        }

        .registration-header p {
            color: rgba(170, 220, 255, 0.5);
            font-size: clamp(0.95rem, 2vw, 1.2rem);
        }

        .form-message {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
            display: none;
            width: 100%;
            animation: slideIn 0.3s ease;
        }

        .form-message.show {
            display: block;
        }

        .form-message.success {
            background: rgba(0, 200, 100, 0.25);
            border: 2px solid #00c864;
            color: #5fff9a;
        }

        .form-message.error {
            background: rgba(255, 100, 100, 0.25);
            border: 2px solid #ff6464;
            color: #ff9999;
        }

        .registration-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            width: 100%;
        }

        .form-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative;
            margin-bottom: 12px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 8px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(92, 179, 255, 0.2);
            color: rgba(220, 255, 240, 0.95);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-bottom-color: #5CB3FF;
        }

        .form-group label {
            position: absolute;
            left: 8px;
            top: 14px;
            font-size: 1rem;
            color: rgba(170, 220, 255, 0.5);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label,
        .form-group select:not([value=""]) + label {
            top: -20px;
            font-size: 0.85rem;
            color: #5CB3FF;
        }

        .form-group input::placeholder {
            color: transparent;
        }

        .events-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 0.95rem;
            color: rgba(170, 220, 255, 0.6);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(92, 179, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event-item:hover {
            transform: translateX(4px);
        }

        .event-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #5CB3FF;
            cursor: pointer;
        }

        .event-item label {
            cursor: pointer;
            color: rgba(213, 255, 233, 0.9);
            font-size: 0.95rem;
            flex: 1;
            position: static;
        }

        .event-item input:checked ~ label {
            color: #5CB3FF;
        }

        .event-details {
            padding: 20px 0;
            border-top: 1px solid rgba(92, 179, 255, 0.15);
            min-height: 80px;
        }

        .event-details.empty {
            color: rgba(170, 220, 255, 0.4);
            text-align: center;
        }

        .event-timing {
            color: #5CB3FF;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .event-description {
            color: rgba(213, 255, 233, 0.85);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .submit-button {
            padding: 14px 32px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(92, 179, 255, 0.4);
            color: #5CB3FF;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            margin-top: 20px;
            width: 100%;
        }

        .submit-button:hover {
            border-bottom-color: #5CB3FF;
            color: #7ec8ff;
            letter-spacing: 0.12em;
        }

        .submit-button:active {
            transform: scale(0.98);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .registration-wrapper {
                padding: 20px;
            }

            .registration-modal-content {
                padding: 40px 20px;
            }

            .registration-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .registration-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Canvas for infinity background -->
    <canvas id="fluidCanvas"></canvas>
    <a href="index.html" class="back-to-home-btn">← Back to Home</a>

    <div class="registration-wrapper">
        <div class="registration-modal-content">
            <div class="registration-header">
                <h1>Registration</h1>
                <p>Join Turinger '26</p>
            </div>

            <div id="formMessage" class="form-message"></div>

            <form id="registrationForm">
                <div class="registration-content">
                    <!-- LEFT COLUMN: FORM -->
                    <div class="form-column">
                        <div class="form-group">
                            <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
                            <label for="fullName">Full Name *</label>
                        </div>

                        <div class="form-group">
                            <input type="email" id="email" name="email" placeholder="Email Address" required>
                            <label for="email">Email Address *</label>
                        </div>

                        <div class="form-group">
                            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
                            <label for="phone">Phone Number *</label>
                        </div>

                        <div class="form-group">
                            <select id="college" name="college" required>
                                <option value="">Select College</option>
                                <option value="mahe">MAHE</option>
                                <option value="non-mahe">Non-MAHE</option>
                            </select>
                            <label for="college">College *</label>
                        </div>

                        <button type="submit" class="submit-button">Register</button>
                    </div>

                    <!-- RIGHT COLUMN: EVENTS -->
                    <div class="events-column">
                        <div class="section-title">Select Events</div>
                        <div class="events-list">
                            <div class="event-item">
                                <input type="checkbox" name="events" value="esp-talk" id="event1">
                                <label for="event1">ESP Talk</label>
                            </div>
                            <div class="event-item">
                                <input type="checkbox" name="events" value="blind-coding" id="event2">
                                <label for="event2">Blind Coding Challenge</label>
                            </div>
                            <div class="event-item">
                                <input type="checkbox" name="events" value="fabric-workshop" id="event3">
                                <label for="event3">Microsoft Fabric Workshop</label>
                            </div>
                            <div class="event-item">
                                <input type="checkbox" name="events" value="ml-marathon" id="event4">
                                <label for="event4">ML Marathon</label>
                            </div>
                            <div class="event-item">
                                <input type="checkbox" name="events" value="token-trivia" id="event5">
                                <label for="event5">Token Trivia Quiz 2026</label>
                            </div>
                            <div class="event-item">
                                <input type="checkbox" name="events" value="squid-game" id="event6">
                                <label for="event6">Squid Game: Tech Edition</label>
                            </div>
                            <div class="event-item">
                                <input type="checkbox" name="events" value="murder-mystery" id="event7">
                                <label for="event7">Case File: Last Commit</label>
                            </div>
                        </div>

                        <div class="event-details empty" id="eventDetails">
                            <p>Select an event to view details</p>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- THREE.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Input Validator Module -->
    <script src="src/js/input-validator.js"></script>
    
    <!-- Infinity Background System -->
    <script src="src/js/infinity-background.js"></script>

    <!-- Firebase Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9S6-j_5sNty-yLyYFRHyqscz1_dgOQLI",
            authDomain: "turinger26.firebaseapp.com",
            projectId: "turinger26",
            storageBucket: "turinger26.firebasestorage.app",
            messagingSenderId: "181306308808",
            appId: "1:181306308808:web:73b641e852126a29674dfd",
            measurementId: "G-31W30HE9HW"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            window.firebaseReady = true;
            window.db = db;
            window.addDoc = addDoc;
            window.collection = collection;
        } catch (error) {
            window.firebaseReady = false;
        }
    </script>

    <!-- Main Application Script -->
    <script>
        const eventDetails = {
            'esp-talk': {
                timing: 'Day 1 • 9:00 AM - 12:00 PM',
                description: 'Interactive expert session featuring industry professionals sharing insights on emerging technologies and career paths.'
            },
            'blind-coding': {
                timing: 'Day 1 • 2:00 PM - 5:00 PM',
                description: 'Code without seeing output, relying purely on logic and focus for clarity of thought.'
            },
            'fabric-workshop': {
                timing: 'Day 2 • 9:00 AM - 4:00 PM',
                description: 'Hands-on workshop exploring modern data analytics using Microsoft Fabric with real-world examples.'
            },
            'ml-marathon': {
                timing: 'Day 3 • 10:00 AM - 12:00 PM',
                description: 'Fast-paced 3-hour sprint building ML models to solve real-world data problems individually.'
            },
            'token-trivia': {
                timing: 'Day 2 • 2:00 PM - 5:00 PM',
                description: 'Fast-paced technical quiz blending ML concepts, logic-based thinking, and industry trivia with eliminations.'
            },
            'squid-game': {
                timing: 'Day 1 • 2:00 PM - 5:00 PM',
                description: 'Elimination-based challenge combining speed, focus, and logic with rapid-fire technical quizzes.'
            },
            'murder-mystery': {
                timing: 'Day 2 • 10:00 AM - 1:00 PM',
                description: 'Cybersecurity murder mystery investigating suspicious death through digital evidence and system logs.'
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize infinity background
            if (typeof InfinityBackground !== 'undefined') {
                const background = new InfinityBackground({
                    canvasId: 'fluidCanvas',
                    gridSize: 50,
                    spacing: 5,
                    backgroundColor: 0x000000,
                    lineColor: 0x0080FE,
                    lineOpacity: 0.4,
                    particleColor: { r: 1.0, g: 1.0, b: 1.0 },
                    particleSize: 0.5,
                    hoverColor: { r: 0, g: 0.502, b: 1 },
                    hoverDistance: 30,
                    hoverLift: 15,
                    cameraPosZ: 60,
                    cameraPosY: 15
                });
                background.init();
            }

            document.querySelectorAll('input[name="events"]').forEach(checkbox => {
                checkbox.addEventListener('change', updateEventDetails);
            });

            const form = document.getElementById('registrationForm');
            form.addEventListener('submit', handleSubmit);
        });

        function updateEventDetails() {
            const checked = document.querySelector('input[name="events"]:checked');
            const detailsDiv = document.getElementById('eventDetails');

            if (checked) {
                const eventId = checked.value;
                const details = eventDetails[eventId];
                detailsDiv.innerHTML = `
                    <div class="event-timing">${details.timing}</div>
                    <div class="event-description">${details.description}</div>
                `;
                detailsDiv.classList.remove('empty');
            } else {
                detailsDiv.innerHTML = '<p>Select an event to view details</p>';
                detailsDiv.classList.add('empty');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('formMessage');
            messageDiv.textContent = text;
            messageDiv.className = `form-message show ${type}`;
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const formMessage = document.getElementById('formMessage');
            const submitButton = document.querySelector('.submit-button');

            try {
                const fullName = document.getElementById('fullName').value;
                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value;
                const college = document.getElementById('college').value;

                const selectedEvents = [];
                document.querySelectorAll('input[name="events"]:checked').forEach(checkbox => {
                    selectedEvents.push(checkbox.value);
                });

                // Validate all inputs
                if (typeof validator === 'undefined') {
                    throw new Error('Validator not initialized');
                }

                const validation = validator.validateRegistrationForm({
                    fullName,
                    email,
                    phone,
                    college,
                    events: selectedEvents
                });

                if (!validation.valid) {
                    showMessage(`Validation Error: ${validation.errors.join(', ')}`, 'error');
                    return;
                }

                const sanitizedData = validation.sanitizedData;

                submitButton.disabled = true;
                submitButton.textContent = 'Processing...';

                if (college === 'non-mahe') {
                    const formData = {
                        ...sanitizedData,
                        timestamp: new Date().toISOString()
                    };
                    sessionStorage.setItem('registrationData', JSON.stringify(formData));
                    sessionStorage.setItem('registrationType', 'registration');
                    showMessage('Redirecting to payment...', 'success');
                    setTimeout(() => {
                        window.location.href = 'https://www.instagram.com';
                    }, 1500);
                } else if (college === 'mahe') {
                    if (!window.firebaseReady || !window.db || !window.addDoc) {
                        throw new Error('Firebase not initialized. Please refresh and try again.');
                    }

                    const docRef = await window.addDoc(window.collection(window.db, "registrations"), {
                        ...sanitizedData,
                        timestamp: new Date().toISOString()
                    });

                    showMessage('✓ Registration successful! See you at Turinger!', 'success');
                    document.getElementById('registrationForm').reset();
                    updateEventDetails();

                    setTimeout(() => {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Register';
                        formMessage.classList.remove('show');
                    }, 5000);
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
                submitButton.disabled = false;
                submitButton.textContent = 'Register';
            }
        }
    </script>
</body>
</html>
